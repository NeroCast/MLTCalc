<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Cotización</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="calculator">
        <div class="inputs">
            <!-- Selector de Suscripción -->
            <div class="form-group">
                <label for="subscription">Suscripción:</label>
                <select id="subscription" onchange="updateFields()">
                    <option value="">Selecciona una opción</option>
                </select>
            </div>

            <!-- Importe de compra -->
            <div class="form-group">
                <label for="price">Captura el importe de tu compra en dólares:</label>
                <input type="number" id="price" placeholder="0" step="0.01" oninput="updateFields()">
            </div>
        </div>

        <!-- Resultados -->
        <div class="results">
            <div class="result-item">
                <span class="label">Costos de trámite de importación:</span>
                <br><br>
                <span class="value" id="orderCost">$0.00</span> USD
            </div>
            <div class="result-item">
                <span class="label">Costo de envío a México:</span>
                <br>
                <span class="text">Al cálculo anterior se le debe agregar</span>
                <span class="text" id="shippingCost">$0.00</span> MXN
                <span class="text" id="shippingCostText">por costo de envío a tu ciudad, hasta 5 kg</span>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
